<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COSWAY AI 中醫體質檢測</title>
    <link rel="stylesheet" href="/frontend/css/style.css">
</head>
<body>
    <div class="container">
        <!-- 第一階段 -->
        <div id="stage1" class="stage active">
            <div class="header">
                <h1>🌿 AI 中醫體質檢測</h1>
                <p class="subtitle">初步自我評估 · 只需 2 分鐘</p>
            </div>
            <form id="questionnaire-form">
                <div class="form-section">
                    <h3>基本資料</h3>
                    <div class="form-group">
                        <label>姓名 <span class="required">*</span></label>
                        <input type="text" id="name" required placeholder="請輸入姓名">
                    </div>
                    <div class="form-group">
                        <label>聯絡電話 <span class="required">*</span></label>
                        <input type="tel" id="phone" required placeholder="請輸入電話">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>性別 <span class="required">*</span></label>
                            <select id="gender" required>
                                <option value="">請選擇</option>
                                <option value="男">男</option>
                                <option value="女">女</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>年齡層 <span class="required">*</span></label>
                            <select id="age_group" required>
                                <option value="">請選擇</option>
                                <option value="18-30">18-30 歲</option>
                                <option value="31-45">31-45 歲</option>
                                <option value="46-60">46-60 歲</option>
                                <option value="61+">61 歲以上</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>檢測人員編號 <span class="optional">(選填)</span></label>
                        <input type="text" id="referral_code" placeholder="檢測人員編號（例如：111557 或 HK111557）">
                    </div>
                </div>
                <div class="form-section">
                    <h3>近期身體狀況</h3>
                    <p class="question-hint">請選擇過去一個月內較明顯的體徵觀察（可複選）</p>
                    <div class="cards-grid" id="symptoms">
                        <label class="symptom-card" data-value="舌象異常">
                            <input type="checkbox" value="舌象異常" hidden>
                            <div class="card-icon">👅</div>
                            <div class="card-title">舌象觀察</div>
                            <div class="card-desc">舌邊有明顯齒痕，或舌苔較厚/發黃</div>
                            <div class="card-check">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="20 6 9 17 4 12"></polyline>
                                </svg>
                            </div>
                        </label>
                        <label class="symptom-card" data-value="晨起覺知">
                            <input type="checkbox" value="晨起覺知" hidden>
                            <div class="card-icon">🌅</div>
                            <div class="card-title">晨起覺知</div>
                            <div class="card-desc">晨起時感到口乾、口苦或面部眼睛微腫</div>
                            <div class="card-check">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="20 6 9 17 4 12"></polyline>
                                </svg>
                            </div>
                        </label>
                        <label class="symptom-card" data-value="體溫循環">
                            <input type="checkbox" value="體溫循環" hidden>
                            <div class="card-icon">❄️</div>
                            <div class="card-title">體溫循環</div>
                            <div class="card-desc">在冷氣房或冬日中，手腳或腰背較易冰涼</div>
                            <div class="card-check">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="20 6 9 17 4 12"></polyline>
                                </svg>
                            </div>
                        </label>
                        <label class="symptom-card" data-value="腸胃消化">
                            <input type="checkbox" value="腸胃消化" hidden>
                            <div class="card-icon">🍽️</div>
                            <div class="card-title">腸胃消化</div>
                            <div class="card-desc">餐後較常感到腹脹，或消化速度較慢</div>
                            <div class="card-check">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="20 6 9 17 4 12"></polyline>
                                </svg>
                            </div>
                        </label>
                        <label class="symptom-card" data-value="睡眠型態">
                            <input type="checkbox" value="睡眠型態" hidden>
                            <div class="card-icon">🌙</div>
                            <div class="card-title">睡眠型態</div>
                            <div class="card-desc">入睡時間較長（&gt;30分鐘）或夜間多夢易醒</div>
                            <div class="card-check">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="20 6 9 17 4 12"></polyline>
                                </svg>
                            </div>
                        </label>
                        <label class="symptom-card" data-value="膚質氣色">
                            <input type="checkbox" value="膚質氣色" hidden>
                            <div class="card-icon">✨</div>
                            <div class="card-title">膚質氣色</div>
                            <div class="card-desc">肌膚較易敏感乾燥，或面色較為暗沉</div>
                            <div class="card-check">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="20 6 9 17 4 12"></polyline>
                                </svg>
                            </div>
                        </label>
                        <label class="symptom-card" data-value="日常活力">
                            <input type="checkbox" value="日常活力" hidden>
                            <div class="card-icon">🔋</div>
                            <div class="card-title">日常活力</div>
                            <div class="card-desc">午後特定時段較易感到精神不濟、體力下滑</div>
                            <div class="card-check">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="20 6 9 17 4 12"></polyline>
                                </svg>
                            </div>
                        </label>
                        <label class="symptom-card" data-value="肌群緊張">
                            <input type="checkbox" value="肌群緊張" hidden>
                            <div class="card-icon">💻</div>
                            <div class="card-title">肌群緊張</div>
                            <div class="card-desc">長期使用手機/電腦導致肩頸肌肉僵硬</div>
                            <div class="card-check">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="20 6 9 17 4 12"></polyline>
                                </svg>
                            </div>
                        </label>
                    </div>
                </div>
                <button type="submit" class="btn-primary">開始 AI 體質分析</button>
            </form>
        </div>
        <!-- 掃描動畫 -->
        <div id="scanning" class="stage">
            <div class="scan-container">
                <div class="scan-ring"></div>
                <div class="scan-ring"></div>
                <div class="scan-ring"></div>
                <div class="scan-icon">🔬</div>
                <h2>AI 體質分析中</h2>
                <p class="scan-text" id="scan-text">正在初始化...</p>
                <div class="scan-bar"><div class="scan-bar-fill" id="scan-bar-fill"></div></div>
            </div>
        </div>
        <!-- 第二階段 -->
        <div id="stage2" class="stage">
            <div class="header">
                <h1>📊 您的 AI 體質分析報告</h1>
                <p class="subtitle">基於中醫體質學的初步評估結果</p>
            </div>
            <div id="report-content"></div>
            <div class="recommendations" id="recommendations"></div>
            <div class="booking-card">
                <h3>🔬 進階深度檢測體驗</h3>
                <p>AI 初步預警顯示您的血管與代謝指標需高度關注。<br>憑此報告，可免費預約至門市進行『量子 / 血管微循環進階檢測』。</p>
                <button class="btn-booking" id="confirm-booking">免費預約門市進階體驗</button>
            </div>
        </div>
    </div>
    <!-- Pop-up -->
    <div id="popup" class="popup-overlay">
        <div class="popup-card">
            <div class="popup-icon">✅</div>
            <h3>預約成功</h3>
            <p>報告已備份至檢測人員 Email</p>
            <button class="btn-primary" id="popup-close">我知道了</button>
        </div>
    </div>
    <script src="/frontend/js/app.js"></script>
</body>
</html>
