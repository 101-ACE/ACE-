<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COSWAY AI 中醫體質檢測</title>
    <link rel="stylesheet" href="/frontend/css/style.css">
</head>
<body>
    <div class="container">
        <!-- 第一階段 -->
        <div id="stage1" class="stage active">
            <div class="header">
                <h1>🌿 AI 中醫體質檢測</h1>
                <p class="subtitle">初步自我評估 · 只需 2 分鐘</p>
            </div>
            <form id="questionnaire-form">
                <div class="form-section">
                    <h3>基本資料</h3>
                    <div class="form-group">
                        <label>姓名 <span class="required">*</span></label>
                        <input type="text" id="name" required placeholder="請輸入姓名">
                    </div>
                    <div class="form-group">
                        <label>聯絡電話 <span class="required">*</span></label>
                        <input type="tel" id="phone" required placeholder="請輸入電話">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>性別 <span class="required">*</span></label>
                            <select id="gender" required>
                                <option value="">請選擇</option>
                                <option value="男">男</option>
                                <option value="女">女</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>年齡層 <span class="required">*</span></label>
                            <select id="age_group" required>
                                <option value="">請選擇</option>
                                <option value="18-30">18-30 歲</option>
                                <option value="31-45">31-45 歲</option>
                                <option value="46-60">46-60 歲</option>
                                <option value="61+">61 歲以上</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="form-section">
                    <h3>體驗資料</h3>
                    <div class="form-group">
                        <label>檢測人員編號 <span class="optional">(選填)</span></label>
                        <input type="text" id="referral_code" placeholder="檢測人員編號（例如：111557 或 HK111557）">
                    </div>
                    <div class="form-group">
                        <label>預約體驗門市 <span class="required">*</span></label>
                        <select id="store" required>
                            <option value="">請選擇門市</option>
                            <option value="將軍澳中心">將軍澳中心</option>
                            <option value="將軍澳寶琳">將軍澳寶琳</option>
                            <option value="樂富">樂富</option>
                            <option value="柴灣">柴灣</option>
                            <option value="佐敦">佐敦</option>
                        </select>
                    </div>
                </div>
                <div class="form-section">
                    <h3>近期身體狀況</h3>
                    <p class="question-hint">請勾選過去一個月內較明顯的症狀（可複選）</p>
                    <div class="checkbox-group" id="symptoms">
                        <label class="checkbox-item">
                            <input type="checkbox" value="睡眠差">
                            <span class="checkmark"></span>
                            <span>睡眠品質較差</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" value="手腳冰冷">
                            <span class="checkmark"></span>
                            <span>手腳容易冰冷</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" value="口乾">
                            <span class="checkmark"></span>
                            <span>經常感到口乾</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" value="易倦">
                            <span class="checkmark"></span>
                            <span>容易疲倦、精神不濟</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" value="消化不良">
                            <span class="checkmark"></span>
                            <span>消化不良或食慾不振</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" value="容易水腫">
                            <span class="checkmark"></span>
                            <span>身體容易水腫</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" value="皮膚敏感">
                            <span class="checkmark"></span>
                            <span>皮膚容易敏感/過敏</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" value="容易生氣">
                            <span class="checkmark"></span>
                            <span>情緒容易起伏/焦慮</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" value="頭暈">
                            <span class="checkmark"></span>
                            <span>頭暈或頭脹</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" value="夜尿頻繁">
                            <span class="checkmark"></span>
                            <span>夜尿次數較多</span>
                        </label>
                    </div>
                </div>
                <button type="submit" class="btn-primary">開始 AI 體質分析</button>
            </form>
        </div>
        <!-- 掃描動畫 -->
        <div id="scanning" class="stage">
            <div class="scan-container">
                <div class="scan-ring"></div>
                <div class="scan-ring"></div>
                <div class="scan-ring"></div>
                <div class="scan-icon">🔬</div>
                <h2>AI 體質分析中</h2>
                <p class="scan-text" id="scan-text">正在初始化...</p>
                <div class="scan-bar"><div class="scan-bar-fill" id="scan-bar-fill"></div></div>
            </div>
        </div>
        <!-- 第二階段 -->
        <div id="stage2" class="stage">
            <div class="header">
                <h1>📊 您的 AI 體質分析報告</h1>
                <p class="subtitle">基於中醫體質學的初步評估結果</p>
            </div>
            <div id="report-content"></div>
            <div class="recommendations" id="recommendations"></div>
            <div class="booking-card">
                <h3>🔬 進階深度檢測體驗</h3>
                <p>AI 初步預警顯示您的血管與代謝指標需高度關注。<br>憑此報告，可免費預約至門市進行『量子 / 血管微循環進階檢測』。</p>
                <button class="btn-booking" id="confirm-booking">免費預約門市進階體驗</button>
            </div>
        </div>
    </div>
    <!-- Pop-up -->
    <div id="popup" class="popup-overlay">
        <div class="popup-card">
            <div class="popup-icon">✅</div>
            <h3>預約成功</h3>
            <p>報告已備份至檢測人員 Email</p>
            <button class="btn-primary" id="popup-close">我知道了</button>
        </div>
    </div>
    <script src="/frontend/js/app.js"></script>
</body>
</html>
